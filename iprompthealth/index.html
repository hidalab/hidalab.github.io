<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPromptHealth | Hi Da Research Lab</title>
<meta name="description" content="iPromptHealth is a Hi Da Research Lab initiative studying how people seek, evaluate, and use generative AI for health information.">
<style>
  :root{
    --bg: #FAFBFD;
    --bg-alt: #EEF2FE;
    --ink: #10151C;
    --ink-soft: #5B6472;
    --blue: #2A4CE0;
    --blue-dark: #16214F;
    --coral: #FF6A4D;
    --line: #E4E8F0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--blue);}
  .wrap{max-width:980px;margin:0 auto;padding:0 24px;}

  header{border-bottom:1px solid var(--line); background:var(--bg);}
  .nav-row{display:flex;align-items:center;justify-content:space-between;padding:18px 0;}
  .nav-row .wrap{display:flex;align-items:center;justify-content:space-between;width:100%;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:36px;height:36px;border-radius:10px;
    background:linear-gradient(135deg, var(--blue), var(--coral));
    flex-shrink:0;
  }
  .brand h1{font-size:1.4rem;margin:0;font-weight:700;letter-spacing:-0.01em;color:var(--ink);}
  .brand p{margin:2px 0 0;font-size:0.88rem;color:var(--ink-soft);}
  nav.main-nav{display:flex;gap:26px;flex-wrap:wrap;align-items:center;}
  nav.main-nav a{
    text-decoration:none;color:var(--ink);font-size:0.94rem;font-weight:500;
    padding-bottom:4px;border-bottom:2px solid transparent;transition:border-color .15s, color .15s;
  }
  nav.main-nav a:hover{border-color:var(--coral);color:var(--blue-dark);}
  .nav-lab-link{
    font-size:0.86rem;color:var(--ink-soft);text-decoration:none;
    border:1px solid var(--line);padding:8px 16px;border-radius:6px;
    white-space:nowrap;
  }
  .nav-lab-link:hover{border-color:var(--blue);color:var(--blue-dark);}

  .hero{
    position:relative;
    min-height:620px;
    display:flex;align-items:center;
    text-align:left;
    padding:0;
    overflow:hidden;
  }
  .hero-bg{
    position:absolute;inset:0;
    background-image:url('istockphoto-2209473287-1024x1024.jpg');
    background-size:cover;
    background-position:center;
    z-index:0;
  }
  .hero-overlay{
    position:absolute;inset:0;
    background:linear-gradient(90deg, var(--bg) 0%, var(--bg) 28%, rgba(250,251,253,0.88) 42%, rgba(250,251,253,0.35) 58%, rgba(250,251,253,0) 72%);
    z-index:1;
  }
  .hero-content{
    position:relative;z-index:2;
    padding:0;
    color:var(--ink);
    max-width:560px;
  }
  .eyebrow{
    display:inline-flex;align-items:center;gap:7px;
    font-size:0.82rem;font-weight:600;color:var(--blue-dark);
    background:var(--bg-alt);
    border:1px solid var(--line);
    padding:6px 14px;border-radius:999px;margin-bottom:22px;
  }
  .eyebrow::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--coral);}
  .hero h2{
    font-size:clamp(2rem,4vw,2.9rem);
    line-height:1.18;margin:0 0 20px;color:var(--ink);font-weight:700;
    letter-spacing:-0.015em;
  }
  .hero p{font-size:1.08rem;color:var(--ink-soft);max-width:46ch;margin:0 0 30px;}
  .hero-cta{
    display:inline-block;background:var(--blue);color:#fff;text-decoration:none;
    padding:13px 26px;border-radius:6px;font-weight:600;font-size:0.96rem;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .hero-cta:hover{transform:translateY(-1px);box-shadow:0 10px 24px -10px rgba(42,76,224,0.5);}

  .photo-credit{
    text-align:right;font-size:0.72rem;color:var(--ink-soft);
    position:absolute;z-index:3;right:24px;bottom:14px;
  }
  .photo-credit a{color:var(--ink-soft);}

  @media (max-width:900px){
    .hero-overlay{background:linear-gradient(180deg, var(--bg) 0%, var(--bg) 38%, rgba(250,251,253,0.9) 55%, rgba(250,251,253,0.55) 75%, rgba(250,251,253,0.15) 100%);}
    .hero-content{max-width:100%;}
  }
  @media (max-width:640px){
    .hero{min-height:560px;}
  }

  @media (max-width:640px){
    .brand-row .wrap{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>
<body>

<header>
  <div class="nav-row">
    <div class="wrap">
      <div class="brand">
        <div>
          <h1>iPromptHealth</h1>
          <p>AI &amp; health information literacy</p>
        </div>
      </div>
      <nav class="main-nav">
        <a href="about.html">About</a>
        <a href="framework.html">Framework</a>
        <a href="study.html">The Study</a>
        <a href="team.html">Team</a>
      </nav>
    </div>
  </div>
</header>

<main>

  <section class="hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="wrap">
      <div class="hero-content">
        <h2>Helping people use AI safely for health information</h2>
        <p>iPromptHealth studies how people seek, evaluate, and use generative AI tools like ChatGPT for health information, and builds the skills to do it safely.</p>
      </div>
    </div>
  </section>

</main>

</body>
</html>
